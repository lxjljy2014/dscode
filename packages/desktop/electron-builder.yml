# electron-builder 打包配置（发布用）。
# 主进程运行时外部化依赖（见 package.json dependencies）：node-pty、electron-updater；
# 其余 workspace/前端依赖均被 electron-vite 打进 out/ 产物，故不进入 dependencies，
# 避免 electron-builder 尝试解析 workspace:*。
appId: com.dscode.app
productName: DSCode
copyright: Copyright © 2026 DSCode

directories:
  output: release
  buildResources: resources

# 自动更新（electron-updater）：发布渠道指向 GitHub Releases。
# 仓库双推：fetch/push 到 github.com/lxjljy2014/dscode（同时 push 到 gitee.com/lixjun/dscode），
# 发布时把 release/ 下生成的 latest.yml 与安装包一并上传到 GitHub Release 即可。
publish:
  provider: github
  owner: lxjljy2014
  repo: dscode

# 打进安装包的内容：编译产物 + 资源；node_modules 仅收集生产依赖（node-pty），package.json 自动包含
files:
  - out/**
  - resources/**
  - '!**/*.map'

asar: true
# node-pty 是原生模块，.node/二进制不能从 asar 内加载，需解包到 app.asar.unpacked
asarUnpack:
  - '**/node_modules/node-pty/**'

# node-pty 用 N-API（ABI 稳定）：macOS/Windows 有官方 prebuild，可直接加载无需 rebuild；
# Linux 无 prebuild，会在 pnpm install 时按系统 Node 走 node-gyp 源码编译（需 python3/make/g++）。
# 本机 VS2022 缺 Spectre-mitigated libraries 组件，node-gyp 重建会失败（MSB8040），故关闭 electron-builder rebuild。
npmRebuild: false

# mac 同时产出 Intel（x64）与 Apple Silicon（arm64）双架构安装包（dmg + zip 各两份）。
# 不用 universal 单包：合并两个架构时 node-pty 的 pty.node（非 Mach-O 原生二进制）无法合并，
# 且 node-pty prebuilds 已覆盖 darwin-x64/darwin-arm64，配合 npmRebuild:false 可直接跨架构打包。
mac:
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # 产物命名带平台与架构标识（如 DSCode-0.1.1-mac-arm64.dmg）
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# win 只出 x64（win32-x64 有 node-pty 官方 prebuild）
win:
  icon: icon-win.png
  target:
    - target: nsis
      arch:
        - x64
  # 产物命名带平台与架构标识（如 DSCode-0.1.1-win-x64-setup.exe）
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DSCode

linux:
  icon: icon-win.png
  category: Development
  target:
    - AppImage
    - deb