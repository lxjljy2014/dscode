# 发布工作流：tag 推送（v*）时在对应平台 runner 上构建安装包并创建 GitHub Release。
# 背景：electron-builder 不支持在 Windows/Linux 上交叉构建 macOS 包（"Build for macOS is supported only on macOS"），
# 故 mac 在 macos-latest 构建、win 在 windows-latest 构建，最后由 publish 任务汇总上传到 GitHub Release。
# 无代码签名证书：mac 跳过签名（CSC_IDENTITY_AUTO_DISCOVERY=false），安装时 Gatekeeper/SmartScreen 会提示未知开发者。
name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS (dmg + zip, x64 + arm64)
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/latest-mac.yml

  win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows (nsis x64)
        run: pnpm dist:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.exe.blockmap
            packages/desktop/release/latest.yml

  publish:
    needs: [mac, win]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/mac/* artifacts/win/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DSCode ${GITHUB_REF_NAME#v}" \
            --notes "DSCode ${GITHUB_REF_NAME#v} 发布（CI 自动构建，未签名）。" \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
